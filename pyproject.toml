[project]
name = "flet-reader"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "attrs>=26.1,<27.0",
    "diwire>=1.3,<2.0",
    "flet>=0.85,<1.0",
    "lxml>=6.1.1,<7.0",
    "msgspec>=0.21.1",
]

[dependency-groups]
dev = [
    "flet-cli>=0.85.2,<1.0",
    "flet-desktop>=0.85,<1.0",
    "flet-web>=0.85,<1.0",
    "mypy>=2.1,<3.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.1,<8.0",
    "pytest-randomly>=4.0,<5.0",
    "pytest-timeout>=2.3,<3.0",
    "covdefaults>=2.3,<3.0",
    "ruff>=0.15,<1.0",
    "wemake-python-styleguide>=1.6,<2.0",
    "sqlfluff>=4.2,<5.0",
    "codespell>=2.4,<3.0",
    "types-lxml>=2026.2.16",
]

[tool.flet]
org = "ru.milssky"
product = "flet-reader"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by milssky and Flet"

[tool.flet.app]
path = "flet_reader"

[tool.uv]
# Docs: https://docs.astral.sh/uv/reference/settings
package = false

[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
target-version = "py314"
line-length = 80

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ASYNC",
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",   # allow to shadow stdlib and builtin module names
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF067",  # wps handles `__init__.py` logic better
  "RUF076",  # we use `autouse` in fixtures
  "TRY003",  # long exception messages from `tryceratops`
]
external = ["WPS"]

# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
# Allow nested imports in some files:
"flet_reader/implemented.py" = ["PLC0415", "D103"]


[tool.pytest.ini_options]
# pytest configuration:
# https://docs.pytest.org/en/stable/customize.html

# Timeout for tests, so they can not take longer
# than this amount of seconds.
# You should adjust this value to be as low as possible.
# Configuration:
# https://pypi.org/project/pytest-timeout/
timeout = 5

# Strict `@xfail` by default:
xfail_strict = true

# Directories that are not visited by pytest collector:
norecursedirs = [
  "*.egg",
  ".eggs",
  "dist",
  "build",
  "docs",
  ".tox",
  ".git",
  "__pycache__",
  ".hypothesis",
]

# You will need to measure your tests speed with `-n auto` and without it,
# so you can see whether it gives you any performance gain, or just gives
# you an overhead. See `docs/template/development-process.rst`.
addopts = [
  "--strict-markers",
  "--strict-config",
  "--doctest-modules",
  # Output:
  "--tb=short",
  # Coverage:
  "--cov=flet_reader",
  "--cov=tests",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=100",
]

# Fail on warnings:
filterwarnings = ["error"]


[tool.coverage.run]
# Coverage configuration:
# https://coverage.readthedocs.io/en/latest/config.html
plugins = [
  # Docs: https://pypi.org/project/covdefaults
  "covdefaults",
]

[tool.mypy]
# Mypy configuration:
# https://mypy.readthedocs.io/en/latest/config_file.html
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "redundant-expr",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "unimported-reveal",
  "deprecated",
  "exhaustive-match",
]

explicit_package_bases = true
ignore_missing_imports = true
local_partial_types = true
strict = true
strict_bytes = true
warn_unreachable = true


[[tool.mypy.overrides]]
module = "server.apps.*.migrations.*"
# Django migrations should not produce any errors (they are tested anyway):
ignore_errors = true


[tool.sqlfluff.core]
# Docs: https://docs.sqlfluff.com
dialect = "sqlite"
templater = "placeholder"
warn_unused_ignores = true

[tool.sqlfluff.templater.placeholder]
param_style = "pyformat"

[tool.codespell]
# codespell configuration: https://pypi.org/project/codespell
skip = '''__pycache__,
*/_build,
.*_cache,
.*_history,
*.lock,
*/generated/*,
.ipython,
.hypothesis,
.safety,
.coverage,
htmlcov,
coverage.xml'''
